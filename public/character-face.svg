<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Intense Neon Glow Filter for the Eyes (Solid Color Glow) -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24" />
      <stop offset="100%" stop-color="#0f0f15" />
    </linearGradient>

    <!-- Mask Base Gradient -->
    <linearGradient id="mask-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
  </defs>

  <!-- Photo Card Base -->
  <rect x="20" y="20" width="360" height="460" rx="15" ry="15" fill="url(#bg-grad)" stroke="#333344" stroke-width="3" filter="url(#drop-shadow)" />

  <!-- Shoulders & Coat -->
  <path d="M 50 480 C 80 400, 130 380, 200 380 C 270 380, 320 400, 350 480 Z" fill="#111116" stroke="#22222d" stroke-width="4" />
  
  <!-- Blue Scarf Wrapped Around Neck -->
  <path d="M 120 380 Q 200 420 280 380 Q 290 350 270 320 Q 200 360 130 320 Q 110 350 120 380 Z" fill="#0055aa" stroke="#003366" stroke-width="3" filter="url(#drop-shadow)" />
  <path d="M 230 395 C 240 430, 230 460, 210 480 L 270 480 C 280 450, 290 410, 280 380 Z" fill="#004488" stroke="#002244" stroke-width="2" />
  <path d="M 140 335 Q 180 370 210 375" fill="none" stroke="#003366" stroke-width="3" stroke-linecap="round" />
  <path d="M 160 360 Q 200 395 240 390" fill="none" stroke="#003366" stroke-width="3" stroke-linecap="round" />
  <path d="M 240 335 Q 260 350 275 350" fill="none" stroke="#003366" stroke-width="3" stroke-linecap="round" />

  <!-- Full Face Mask (Ovoid Shape) -->
  <path d="M 100 200 C 100 80, 300 80, 300 200 C 300 320, 240 370, 200 370 C 160 370, 100 320, 100 200 Z" fill="url(#mask-grad)" stroke="#111" stroke-width="3" />

  <!-- Mask Seam (Center line down the face) -->
  <path d="M 200 100 L 200 370" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 4" opacity="0.5" />

  <!-- SPIDER-MAN STYLE EYES -->
  
  <!-- Thick Black Rims (Underneath the glowing lenses) -->
  <g fill="#111111" stroke="#111111" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="4">
    <!-- Left Rim -->
    <path d="M 128 185 Q 163 220 183 245 C 153 285, 108 255, 128 185 Z" />
    <!-- Right Rim -->
    <path d="M 272 185 Q 237 220 217 245 C 247 285, 292 255, 272 185 Z" />
  </g>

  <!-- Glowing Solid Neon Lenses -->
  <g filter="url(#neon-glow)" fill="#00e5ff">
    <!-- Left Lens -->
    <path d="M 128 185 Q 163 220 183 245 C 153 285, 108 255, 128 185 Z" />
    <!-- Right Lens -->
    <path d="M 272 185 Q 237 220 217 245 C 247 285, 292 255, 272 185 Z" />
  </g>

  <!-- Subtle static/noise overlay -->
  <rect x="20" y="20" width="360" height="460" rx="15" ry="15" fill="url(#scanlines)" opacity="0.3" pointer-events="none" />
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.3" />
    </pattern>
  </defs>
</svg>
