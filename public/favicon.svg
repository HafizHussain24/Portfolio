<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- CASE FILE emblem: stylised magnifier with an eye pupil -->
  <!-- Circle (lens rim) -->
  <circle cx="13" cy="13" r="9" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Eye shape inside the lens -->
  <ellipse cx="13" cy="13" rx="6" ry="3.5" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <!-- Pupil -->
  <circle cx="13" cy="13" r="2" fill="#00e5ff"/>
  <!-- Handle -->
  <line x1="20" y1="20" x2="28" y2="28" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
</svg>